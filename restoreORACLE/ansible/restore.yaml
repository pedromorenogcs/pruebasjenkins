---
- name: Test restore oracle database.
  hosts: oracleservers
  vars_files:
    - "{{ WORKSPACE }}/restoreORACLE/ansible/external_vars.yaml"
  become: true
  remote_user: advusr 
  become_user: oracle
  vars:
    ansible_password: "{{ ansible_sudo_pass }}"

  tasks:

  - debug: msg="{{ lookup('env','BUILD_TAG') }}"

  - name: Basic usage
    ansible.builtin.debug:
      msg: "'{{ WORKSPACE }}' WORKSPACE env "

  - name: Create a directory if it does not exist
    file:
      path: "{{ remote_path }}"
      state: directory
      mode: '0755'

  - name: Copy scripts to the remote host
    template: 
      src: "{{ WORKSPACE }}/restoreORACLE/database/scripts/restoreDB.sh"
      dest: "{{ remote_path }}"
      mode: '0700'

  - name: run restoreDB.sh, async wait for up to 3hrs and ask every 60 sec
    ansible.builtin.command: "{{ remote_path }}/restoreDB.sh"
      async: 10800
      pull: 60
      register: out

  - debug: 
     var: out.stdout_lines

